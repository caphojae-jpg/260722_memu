<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메뉴판</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1 class="restaurant-name">가게 이름</h1>
    <p class="tagline">정성을 담은 한 끼</p>
  </header>

  <nav class="category-nav">
    <button class="category-btn active" data-category="all">전체</button>
    <button class="category-btn" data-category="main">메인 메뉴</button>
    <button class="category-btn" data-category="side">사이드</button>
    <button class="category-btn" data-category="drink">음료</button>
  </nav>

  <main class="menu-container">

    <section class="menu-item" data-category="main">
      <img src="images/menu1.jpg" alt="메뉴 사진 1" class="menu-image" onerror="this.src='images/placeholder.svg'">
      <div class="menu-info">
        <h2 class="menu-name">대표 메뉴 1</h2>
        <p class="menu-desc">메뉴에 대한 간단한 설명을 적어주세요.</p>
        <span class="menu-price">10,000원</span>
      </div>
    </section>

    <section class="menu-item" data-category="main">
      <img src="images/menu2.jpg" alt="메뉴 사진 2" class="menu-image" onerror="this.src='images/placeholder.svg'">
      <div class="menu-info">
        <h2 class="menu-name">대표 메뉴 2</h2>
        <p class="menu-desc">메뉴에 대한 간단한 설명을 적어주세요.</p>
        <span class="menu-price">12,000원</span>
      </div>
    </section>

    <section class="menu-item" data-category="side">
      <img src="images/menu3.jpg" alt="메뉴 사진 3" class="menu-image" onerror="this.src='images/placeholder.svg'">
      <div class="menu-info">
        <h2 class="menu-name">사이드 메뉴 1</h2>
        <p class="menu-desc">메뉴에 대한 간단한 설명을 적어주세요.</p>
        <span class="menu-price">4,000원</span>
      </div>
    </section>

    <section class="menu-item" data-category="drink">
      <img src="images/menu4.jpg" alt="메뉴 사진 4" class="menu-image" onerror="this.src='images/placeholder.svg'">
      <div class="menu-info">
        <h2 class="menu-name">음료 1</h2>
        <p class="menu-desc">메뉴에 대한 간단한 설명을 적어주세요.</p>
        <span class="menu-price">3,000원</span>
      </div>
    </section>

  </main>

  <footer class="footer">
    <p>영업시간 안내 · 주소 · 연락처를 이 곳에 적어주세요.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
